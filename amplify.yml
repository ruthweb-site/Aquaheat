version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd app/frontend
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: app/frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - app/frontend/.npm/**/*
      - app/frontend/.next/cache/**/*
