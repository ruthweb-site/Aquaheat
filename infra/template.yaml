AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AquaHeat — Mumbai Heat Safety Platform Infrastructure Foundation (Phase 3)
  AWS SAM template provisioning API Gateway, Health Lambda, DynamoDB tables,
  private S3 data bucket, and CloudWatch log groups with least-privilege IAM.

# ==============================================================================
# PARAMETERS
# ==============================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Target deployment stage (dev, staging, prod)

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Logging verbosity for Lambda functions

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 365
    Description: Retention period in days for CloudWatch log groups

# ==============================================================================
# GLOBALS
# ==============================================================================
Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        NODE_OPTIONS: '--enable-source-maps'
  Api:
    TracingEnabled: true
    OpenApiVersion: '3.0.1'

# ==============================================================================
# RESOURCES
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # S3 DATA LAKE / ASSET STORAGE (Private, Encrypted, Least-Privilege)
  # Standard Prefixes: raw-weather/, processed/, model-artifacts/
  # ----------------------------------------------------------------------------
  AquaHeatDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aquaheat-data-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RawWeatherStorageOptimization
            Status: Enabled
            Prefix: raw-weather/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
            ExpirationInDays: 365
          - Id: ProcessedDataStorageOptimization
            Status: Enabled
            Prefix: processed/
            Transitions:
              - TransitionInDays: 60
                StorageClass: STANDARD_IA
      Tags:
        - Key: Project
          Value: AquaHeat
        - Key: Environment
          Value: !Ref Environment

  AquaHeatDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AquaHeatDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceSecureTransportOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${AquaHeatDataBucket}"
              - !Sub "arn:${AWS::Partition}:s3:::${AquaHeatDataBucket}/*"
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ----------------------------------------------------------------------------
  # DYNAMODB TABLES
  # ----------------------------------------------------------------------------

  # 1. AquaHeatUsers — Citizen & worker profiles
  AquaHeatUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "AquaHeatUsers-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: AquaHeat
        - Key: Environment
          Value: !Ref Environment

  # 2. AquaHeatWeather — Observations partitioned by locationId, sorted by timestamp
  AquaHeatWeatherTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "AquaHeatWeather-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: AquaHeat
        - Key: Environment
          Value: !Ref Environment

  # 3. AquaHeatForecasts — Multi-horizon forecasts by locationId, sorted by forecastTimestamp
  AquaHeatForecastsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "AquaHeatForecasts-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: forecastTimestamp
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: forecastTimestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: AquaHeat
        - Key: Environment
          Value: !Ref Environment

  # 4. AquaHeatAlerts — Alert dispatch records with GSIs for location and user queries
  AquaHeatAlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "AquaHeatAlerts-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: LocationTimestampIndex
          KeySchema:
            - AttributeName: locationId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: UserTimestampIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: AquaHeat
        - Key: Environment
          Value: !Ref Environment

  # ----------------------------------------------------------------------------
  # API GATEWAY (REST API Foundation)
  # ----------------------------------------------------------------------------
  AquaHeatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "AquaHeatApi-${Environment}"
      StageName: !Ref Environment
      Description: "AquaHeat Mumbai Heat Safety Core REST API Gateway"
      AccessLogSetting:
        DestinationArn: !GetAtt AquaHeatApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: false
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'https://aquaheat.mumbai.gov.in'"
        MaxAge: "'600'"

  AquaHeatApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/AquaHeatApi-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  # ----------------------------------------------------------------------------
  # LAMBDA: Health Check Function
  # Endpoint: GET /health
  # Response: {"service": "AquaHeat", "status": "ok"}
  # ----------------------------------------------------------------------------
  AquaHeatHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "AquaHeatHealth-${Environment}"
      Description: "AquaHeat health probe invoked via GET /health"
      CodeUri: ../backend/functions/health/
      Handler: index.handler
      Runtime: nodejs22.x
      Role: !GetAtt AquaHeatHealthFunctionRole.Arn
      Events:
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref AquaHeatApi
            Path: /health
            Method: GET
      Environment:
        Variables:
          SERVICE_NAME: AquaHeat
          APP_STATUS: ok

  AquaHeatHealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/AquaHeatHealth-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  AquaHeatHealthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "AquaHeatHealthRole-${Environment}"
      Description: "Least-privilege execution role for AquaHeat Health probe Lambda"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AquaHeatHealthLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowCloudWatchLogsCreation
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/AquaHeatHealth-${Environment}:*"

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:
  ApiBaseUrl:
    Description: Base invocation URL for AquaHeat API Gateway
    Value: !Sub "https://${AquaHeatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "AquaHeat-ApiBaseUrl-${Environment}"

  HealthEndpoint:
    Description: Direct URL for GET /health endpoint
    Value: !Sub "https://${AquaHeatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/health"
    Export:
      Name: !Sub "AquaHeat-HealthEndpoint-${Environment}"

  DataBucketName:
    Description: Name of private AquaHeat data bucket
    Value: !Ref AquaHeatDataBucket
    Export:
      Name: !Sub "AquaHeat-DataBucketName-${Environment}"

  DataBucketArn:
    Description: ARN of private AquaHeat data bucket
    Value: !GetAtt AquaHeatDataBucket.Arn
    Export:
      Name: !Sub "AquaHeat-DataBucketArn-${Environment}"

  UsersTableName:
    Description: DynamoDB table name for AquaHeat users
    Value: !Ref AquaHeatUsersTable
    Export:
      Name: !Sub "AquaHeat-UsersTable-${Environment}"

  WeatherTableName:
    Description: DynamoDB table name for AquaHeat weather observations
    Value: !Ref AquaHeatWeatherTable
    Export:
      Name: !Sub "AquaHeat-WeatherTable-${Environment}"

  ForecastsTableName:
    Description: DynamoDB table name for AquaHeat forecast projections
    Value: !Ref AquaHeatForecastsTable
    Export:
      Name: !Sub "AquaHeat-ForecastsTable-${Environment}"

  AlertsTableName:
    Description: DynamoDB table name for AquaHeat civic & user alerts
    Value: !Ref AquaHeatAlertsTable
    Export:
      Name: !Sub "AquaHeat-AlertsTable-${Environment}"
